name: build

on:
  push:
    tags:
      - 'v*'
env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          docker image prune --all --force || true
          df -h

      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/helper/target
          key: cargo-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('services/helper/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Setup Java
        if: startsWith(matrix.platform,'android')
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Java x64 for Windows arm64
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SERVICE_JSON: ${{ secrets.SERVICE_JSON }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          fi
          if [ -n "$SERVICE_JSON" ]; then
            echo "$SERVICE_JSON" | base64 --decode > android/app/google-services.json
          fi
          if [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "keyAlias=$KEY_ALIAS" >> android/local.properties
            echo "storePassword=$STORE_PASSWORD" >> android/local.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/local.properties
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: |
            core/go.sum

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('core/go.sum', 'core/**/*.go') }}
          restore-keys: |
            go-build-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Setup Flutter
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - name: Setup Flutter With Other
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.41.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Download VC++ Runtime DLLs
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vcArch = if ("${{ matrix.arch }}" -eq "arm64") { "arm64" } else { "x64" }
          $vcUrl = "https://aka.ms/vs/17/release/vc_redist.$vcArch.exe"
          $destDir = "windows/VC_RUNTIME"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          Write-Host "Downloading vc_redist.$vcArch.exe from $vcUrl"
          Invoke-WebRequest -Uri $vcUrl -OutFile "$env:TEMP\vc_redist.exe"
          Write-Host "Extracting DLLs..."
          & "$env:TEMP\vc_redist.exe" /layout "$env:TEMP\vc_layout" /q
          Copy-Item "$env:TEMP\vc_layout\$vcArch\*.dll" $destDir\ -Force
          Get-ChildItem $destDir | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Setup
        shell: bash
        run: |
          set -o pipefail
          dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} 2>&1 | tee build-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: build-*.log
          if-no-files-found: ignore

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-1.2.1-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

